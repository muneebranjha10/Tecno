name: Build Tecno Spark 40 LSPosed APK

on:
  push:
    branches: [main]
    paths:
      - 'TecnoSpark40_LSPosed_Source_Alpha.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify uploaded ZIP
        shell: bash
        run: |
          test -f TecnoSpark40_LSPosed_Source_Alpha.zip || { echo "::error::Please upload the source ZIP"; exit 1; }
          unzip -tq TecnoSpark40_LSPosed_Source_Alpha.zip

      - name: Extract Android project
        shell: bash
        run: |
          unzip -q TecnoSpark40_LSPosed_Source_Alpha.zip
          test -f TecnoSpark40_LSPosed_Port/settings.gradle
          test -f TecnoSpark40_LSPosed_Port/app/src/main/assets/charge/entry.webp

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub hosted Ubuntu runners already provide Android SDK command-line tools.
      # Do not run android-actions/setup-android@v3 here: it attempts to install
      # the removed legacy SDK 'tools' package and fails on current runners.
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found inside Android SDK"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install SDK 35
        shell: bash
        run: |
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        working-directory: TecnoSpark40_LSPosed_Port
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tecno-Spark40-Charge-LSPosed-APK
          path: TecnoSpark40_LSPosed_Port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
